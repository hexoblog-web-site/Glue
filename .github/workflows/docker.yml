name: docker

# 打 tag 或推 main 时自动构建镜像并推到 GitHub Container Registry，
# 别人就不用在自己机器上 build 了（对标 twikoo 的 imaegoo/twikoo）。
#
#   docker pull ghcr.io/hexoblog-web-site/glue:latest
#
# 首次推送后，到仓库首页右侧 Packages 里把该包的可见性改成 Public，匿名才能拉取。

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  IMAGE: ghcr.io/hexoblog-web-site/glue

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # arm64 走 QEMU 模拟，pdo_mysql 编译会慢一些，但能覆盖 Apple Silicon / 树莓派
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 摘要
        run: |
          {
            echo "### 镜像已推送"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "拉取：\`docker pull ${{ env.IMAGE }}:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
