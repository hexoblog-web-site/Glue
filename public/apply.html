<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>申请友链</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --text:#1c1f23; --muted:rgba(28,31,35,.6);
    --line:rgba(0,0,0,.08); --brand:#3b82f6;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1114; --card:#171a1e; --text:#e8eaed; --muted:rgba(232,234,237,.56);
      --line:rgba(255,255,255,.09); --brand:#60a5fa;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0;padding:36px 18px 64px;background:var(--bg);color:var(--text);
    font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:640px;margin:0 auto}
  .back{
    display:inline-flex;align-items:center;gap:6px;margin-bottom:18px;
    font-size:13px;color:var(--muted);text-decoration:none;
  }
  .back:hover{color:var(--text)}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:26px 26px 22px;box-shadow:0 1px 2px rgba(0,0,0,.03),0 8px 24px rgba(0,0,0,.04);
  }
  .head{margin-bottom:22px}
  .head h1{margin:0 0 8px;font-size:21px;font-weight:650;letter-spacing:-.2px}
  .head p{margin:0;font-size:13.5px;color:var(--muted)}
  .head .tips{
    margin-top:14px;padding:11px 14px;border-radius:10px;
    background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.16);
    font-size:12.5px;line-height:1.7;color:var(--muted);
  }
  .head .tips b{color:var(--text);font-weight:500}
  .divider{height:1px;background:var(--line);margin:26px 0 20px;border:0}
  .links-title{display:flex;align-items:baseline;gap:8px;margin:0 0 14px}
  .links-title h2{margin:0;font-size:14.5px;font-weight:600}
  .links-title span{font-size:12px;color:var(--muted)}
  .links{display:grid;grid-template-columns:repeat(auto-fill,minmax(184px,1fr));gap:10px}
  .link{
    display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;
    border:1px solid var(--line);text-decoration:none;color:inherit;
    transition:border-color .18s,transform .12s;
  }
  .link:hover{border-color:var(--brand);transform:translateY(-1px)}
  .link img,.link i{
    width:32px;height:32px;flex:none;border-radius:8px;object-fit:cover;
    display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:600;
    color:#fff;background:#94a3b8;
  }
  .link .txt{min-width:0}
  .link .txt strong{
    display:block;font-size:13px;font-weight:500;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .link .txt em{
    display:block;font-style:normal;font-size:11.5px;color:var(--muted);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .empty{padding:16px;text-align:center;font-size:12.5px;color:var(--muted);
    border:1px dashed var(--line);border-radius:10px}
  .foot{margin-top:22px;text-align:center;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="#" id="backHome" hidden>← 回到主站</a>

  <div class="card">
    <div class="head">
      <h1>申请友链</h1>
      <p>填完提交，站长审核通过后会出现在友链页和朋友圈里。</p>
      <div class="tips" id="tips" hidden></div>
    </div>

    <div data-friend-apply data-title="" data-note=""></div>
  </div>

  <hr class="divider">

  <div class="links-title">
    <h2>已经收录的站点</h2>
    <span id="linksCount"></span>
  </div>
  <div class="links" id="links"></div>

  <p class="foot">由 Beacon Monitor 提供</p>
</div>

<script src="/e/apply.js" defer></script>
<script>
(function () {
  function esc(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function hueOf(text) {
    var hash = 0;
    var str = String(text || '');
    for (var i = 0; i < str.length; i += 1) hash = (hash * 31 + str.charCodeAt(i)) % 360;
    return hash;
  }

  fetch('/api/e/friends.json', { credentials: 'omit' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (data) {
      if (!data) return;

      if (data.site) {
        var home = document.getElementById('backHome');
        home.href = data.site;
        home.hidden = false;
        document.title = '申请友链 · ' + (data.name || data.site);
      }

      var links = data.links || [];
      var box = document.getElementById('links');
      var count = document.getElementById('linksCount');

      if (!links.length) {
        box.innerHTML = '<div class="empty" style="grid-column:1/-1">还没有收录任何站点</div>';
        return;
      }
      count.textContent = links.length + ' 个';

      box.innerHTML = links.map(function (l) {
        var avatar = l.avatar
          ? '<img src="' + esc(l.avatar) + '" alt="" loading="lazy" referrerpolicy="no-referrer">'
          : '<i style="background:hsl(' + hueOf(l.name) + ',52%,62%)">' +
            esc(String(l.name || '?').slice(0, 1)) + '</i>';
        return '<a class="link" href="' + esc(l.url) + '" target="_blank" rel="noopener">' +
          avatar +
          '<span class="txt"><strong>' + esc(l.name) + '</strong>' +
          (l.desc ? '<em>' + esc(l.desc) + '</em>' : '') +
          '</span></a>';
      }).join('');
      box.querySelectorAll('img').forEach(function (img) {
        img.addEventListener('error', function () {
          var name = img.parentNode.querySelector('strong').textContent;
          var i = document.createElement('i');
          i.style.background = 'hsl(' + hueOf(name) + ',52%,62%)';
          i.textContent = String(name || '?').slice(0, 1);
          img.replaceWith(i);
        });
      });
    })
    .catch(function () {});
})();
</script>
</body>
</html>
