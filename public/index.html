<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>服务状态</title>
  <meta name="description" content="实时监控站点与服务可用性" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ctext y='19' font-size='19'%3E%F0%9F%97%BC%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/assets/app.css" />
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <div class="page">
    <header class="topbar">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v2M4.9 4.9l1.4 1.4M19.1 4.9l-1.4 1.4" />
            <path d="M9.5 8h5l1.2 10.2a2 2 0 0 1-2 2.2H10.3a2 2 0 0 1-2-2.2L9.5 8Z" />
            <path d="M9.8 12.5h4.4M10 16h4" />
          </svg>
        </span>
        <span class="brand-text">
          <strong id="siteTitle">服务状态</strong>
          <small id="siteDesc">实时监控中</small>
        </span>
      </a>

      <div class="topbar-actions">
        <button class="btn btn-ghost" id="refreshBtn" type="button">
          <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3.2-6.9" /><path d="M21 3v6h-6" /></svg>
          <span>刷新</span>
        </button>
        <button class="btn btn-ghost btn-icon" id="themeBtn" type="button" title="切换主题" aria-label="切换主题">
          <svg class="i i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.5 6.5 0 0 0 9.8 9.8Z" /></svg>
          <svg class="i i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
        </button>
        <a class="btn btn-ghost" href="/admin">
          <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" /><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2 2 2 0 1 1-4 0 1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 15a2 2 0 1 1 0-4 1.7 1.7 0 0 0 1.5-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 10 4.6a2 2 0 1 1 4 0 1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A1.7 1.7 0 0 0 21 11a2 2 0 1 1 0 4Z" /></svg>
          <span>管理</span>
        </a>
      </div>
    </header>

    <section class="hero" id="hero">
      <div class="hero-main">
        <div class="hero-badge" id="heroBadge">
          <span class="pulse"></span>
          <span id="heroBadgeText">连接中</span>
        </div>
        <h1 id="heroTitle">正在获取服务状态…</h1>
        <p id="heroDesc">请稍候</p>
        <div class="hero-meta">
          <span id="updatedAt">--</span>
          <span class="sep">·</span>
          <span id="autoRefresh">自动刷新</span>
        </div>
      </div>
      <div class="hero-stats">
        <div class="stat">
          <b id="statUp">–</b>
          <span>正常</span>
        </div>
        <div class="stat">
          <b id="statTotal">–</b>
          <span>监控项</span>
        </div>
        <div class="stat">
          <b id="statAvg">–</b>
          <span>平均延迟</span>
        </div>
      </div>
    </section>

    <main id="groups" class="groups" aria-live="polite">
      <div class="skeleton-wrap">
        <div class="skeleton-group"></div>
        <div class="skeleton-grid">
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p id="footerText"></p>
      <p class="footer-note">
        检测间隔默认 60 秒 · 数据保留 90 天 · Powered by
        <a href="https://github.com/hexoblog-web-site/beacon-monitor" target="_blank" rel="noopener">Beacon Monitor</a>
      </p>
    </footer>
  </div>

  <!-- 详情弹窗 -->
  <div class="modal" id="modal" hidden>
    <div class="modal-mask" data-close></div>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <header class="modal-head">
        <div>
          <div class="modal-title-row">
            <h2 id="modalTitle">监控详情</h2>
            <span class="pill" id="modalStatus">—</span>
          </div>
          <a class="modal-url" id="modalUrl" href="#" target="_blank" rel="noopener"></a>
        </div>
        <button class="btn btn-ghost btn-icon" data-close type="button" aria-label="关闭">
          <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18" /></svg>
        </button>
      </header>

      <div class="modal-body">
        <div class="range-tabs" id="rangeTabs">
          <button type="button" class="active" data-range="24h">24 小时</button>
          <button type="button" data-range="7d">7 天</button>
          <button type="button" data-range="30d">30 天</button>
        </div>

        <div class="chart-stats" id="chartStats"></div>
        <div class="chart-box" id="chartBox">
          <div class="chart-empty">加载中…</div>
        </div>

        <dl class="detail-grid" id="detailGrid"></dl>
      </div>
    </div>
  </div>

  <div class="bar-tip" id="barTip" hidden></div>

  <script src="/assets/app.js"></script>
</body>
</html>
