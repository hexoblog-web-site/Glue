# Sugar-Box · 容器内 Nginx 站点配置
#
# 这个文件被复制到 /etc/nginx/conf.d/zan.conf，
# 由 php:8.3-fpm 镜像里 apt 装的 nginx 自动 include（默认 nginx.conf 已包含 conf.d/*.conf）。
#
# 职责很窄：
#   · 静态文件直出，其余全部交给 PHP-FPM
#   · 拦住不该被直接访问的目录（/data、/include、点文件）
#   · 把宿主机反代传来的 X-Forwarded-* 透传给 PHP，让程序知道自己是 https

server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    root  /var/www/html;
    index index.php index.html;

    charset utf-8;
    server_tokens off;

    # 备份恢复要传 JSON，与 php.ini 的 32M 保持一致
    client_max_body_size 32m;

    # config.php 与 data/ 是指向 /data 数据卷的软链，必须允许跟随
    disable_symlinks off;

    # ---- 安全响应头 ----------------------------------------------------------
    # 接口要被别的域名 <script> 引用，所以不能下发 COEP / CORP；
    # CORS 白名单由程序自身（allowed_origins）控制。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- 压缩 ---------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   5;
    gzip_types        text/plain text/css text/javascript
                      application/javascript application/json
                      application/xml image/svg+xml;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # ---- 禁止直接访问的路径 --------------------------------------------------

    # 数据卷：备份包、登录节流状态等运行期文件，绝不能被浏览器取走
    location ^~ /data/ {
        deny all;
    }

    # 程序内部库文件，只应由 index.php / api/*.php 引入，不单独对外
    location ^~ /include/ {
        deny all;
    }

    # .git / .env / .dockerignore 之类
    location ~ /\. {
        deny all;
    }

    # ---- 静态资源短缓存 ------------------------------------------------------
    # 脚本与样式带 ?v=版本号，放心缓存；容器重建后文件名不变但版本号会变
    location ~* \.(?:css|js|mjs|svg|png|jpe?g|gif|webp|ico|woff2?|ttf)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # ---- 入口 ---------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ---- PHP ----------------------------------------------------------------
    location ~ \.php$ {
        try_files $uri =404;

        fastcgi_pass  127.0.0.1:9000;
        fastcgi_index index.php;
        include       fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $document_root;

        # 程序靠 Host 拼回调地址与 CORS 校验，必须传进去
        fastcgi_param HTTP_HOST $host;

        # 宿主机 Nginx 终结 TLS，把真实协议与访客 IP 用 X-Forwarded-* 传进来；
        # 这里继续透传给 PHP，否则程序会把自己当成 http，登录 Cookie 也会丢 Secure。
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_FOR   $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_REAL_IP         $remote_addr;

        fastcgi_read_timeout 60s;
        fastcgi_buffers      16 16k;
        fastcgi_buffer_size  32k;
    }

    # 后台不需要单独 rule：/admin/ 由 location / 的 try_files 走目录 index，
    # 落到 /admin/index.php 后由上面的 \.php$ 规则交给 PHP-FPM。
    # （不要给 /admin/ 加 ^~ 前缀块，否则 .php 请求会绕过 FastCGI 变成源码下载）

    # 健康检查顺手给容器内用，不写日志
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }
}
