; Glue · PHP-FPM 补充配置
;
; 官方 php:8.3-fpm 镜像的 zz-docker.conf 会 listen = 9000（监听所有网卡）。
; 这里覆盖成只监听回环：容器内只有 nginx 需要连它，宿主机与同网段的其他容器都不该能直连 FastCGI。
;
; 文件名以 zz- 开头且在 zz-docker.conf 之后被读取，因此这里的 listen 生效。

[www]
listen = 127.0.0.1:9000

; 2G 内存的小机器 / 容器限 256M：峰值 6 个 worker 足够
pm = dynamic
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; 慢请求写进日志，方便排查
request_slowlog_timeout = 5s
slowlog = /proc/self/fd/2

; 只允许 .php 主脚本，挡掉常见的路径解析花招
security.limit_extensions = .php
