# Sugar-Box · Apache 站点配置
#
# 只做三件事：关掉目录浏览、加几个安全响应头、让 PHP 文件按 404 处理不存在的情况。

<Directory /var/www/html>
    Options -Indexes -Includes
    AllowOverride None
    Require all granted
</Directory>

# 安装向导在装完后仍保留：它自己会检测已安装并只显示「已安装」，不会重复建表。
# 想更彻底，可以在容器启动后执行 docker exec zan rm -rf /var/www/html/install

<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # 接口与脚本需要被别的域名引用，这里不能下发 COEP/CORP；
    # CORS 白名单由程序自身（allowed_origins）控制。
</IfModule>

# 静态资源短缓存（脚本带 ?v= 版本号，放心缓存）
<IfModule mod_expires.c>
    ExpiresActive On
    ExpiresByType text/css "access plus 7 days"
    ExpiresByType application/javascript "access plus 7 days"
    ExpiresByType image/svg+xml "access plus 30 days"
</IfModule>

# 默认字符集
AddDefaultCharset UTF-8

# 错误页交给程序自己处理，别把 500 变成 Apache 的 HTML
ErrorDocument 500 /index.php
