; Glue · PHP 运行时参数
; 目标是「2G 内存的小机器也能跑得舒服」，同时不牺牲点赞接口的正确性。

memory_limit = 128M
max_execution_time = 60
max_input_time = 60

; 备份恢复要传 JSON，给到 32M（后台会按实际值显示上传上限）
upload_max_filesize = 32M
post_max_size = 32M
max_file_uploads = 5

; 时区与编码（php.ini 不做环境变量展开，需要别的时区就改这一行重新构建）
date.timezone = Asia/Shanghai
default_charset = "UTF-8"
mbstring.language = neutral

; 生产环境：错误只进日志，不打印到响应里（接口必须是纯 JSON）
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED & ~E_NOTICE

; 不暴露版本号
expose_php = Off

; OPcache：缓存字节码省下每次编译开销。
; 注意 validate_timestamps 必须为 1：后台保存设置、在线更新都会改写 config.php
; 与程序文件，关掉时间戳校验的话 PHP 会一直跑旧代码，表现出来就是「设置存了不生效」
; 「更新了还是旧版本」。revalidate_freq=0 表示每次请求都检查，代价可以忽略。
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 64
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 4000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; 会话（后台登录）只需要几十字节，别让它写满磁盘
session.gc_maxlifetime = 86400
session.cookie_httponly = 1
session.use_strict_mode = 1

; 上传临时目录留在容器内即可
upload_tmp_dir = /tmp
